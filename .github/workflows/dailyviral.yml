name: DailyViral

on:
  schedule:
    # UTC year-round; local wall-clock time changes with daylight saving time.
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run_override:
        description: "Preview only (no render, upload, refresh, or publish)"
        required: true
        default: true
        type: boolean
      force:
        description: "Bypass duplicate-caption checks (may create a duplicate post)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dailyviral-publishing
  cancel-in-progress: false

jobs:
  post-daily:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: publishing
    steps:
      - name: Check out trusted default-branch revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install verified dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Run regression tests without credentials
        run: python -m unittest discover -v

      - name: Render and publish
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_SECURITY_API_TOKEN: ${{ secrets.R2_SECURITY_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_BASE_VIDEO_KEY: ${{ vars.R2_BASE_VIDEO_KEY }}
          R2_SIGNED_URL_TTL_SECONDS: ${{ vars.R2_SIGNED_URL_TTL_SECONDS || '900' }}
          DAILYVIRAL_START_DATE: ${{ vars.DAILYVIRAL_START_DATE }}
          DAILYVIRAL_CAPTION_TEMPLATE: ${{ vars.DAILYVIRAL_CAPTION_TEMPLATE }}
          DAILYVIRAL_HASHTAGS: ${{ vars.DAILYVIRAL_HASHTAGS }}
          DAILYVIRAL_TIMEZONE: ${{ vars.DAILYVIRAL_TIMEZONE || 'America/New_York' }}
          AUTO_POST_ENABLED: ${{ vars.AUTO_POST_ENABLED || 'false' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          ENABLE_VIDEO_OVERLAY: ${{ vars.ENABLE_VIDEO_OVERLAY || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          PREVIEW_ONLY: ${{ inputs.dry_run_override }}
          FORCE_POST: ${{ inputs.force }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$PREVIEW_ONLY" == "true" ]]; then
            export DRY_RUN=true
          fi
          args=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_POST" == "true" ]]; then
            args+=(--force)
          fi
          python -m dailyviral gha-post-daily main_meme_account "${args[@]}"
