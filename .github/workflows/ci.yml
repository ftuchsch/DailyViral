name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "43 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install pinned CI tools and verified runtime dependencies
        run: |
          python -m pip install --only-binary=:all: pip==26.2.1 setuptools==84.0.0 ruff==0.16.9 pip-audit==2.10.1
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Run tests
        run: python -m unittest discover -v
      - name: Audit dependencies
        run: pip-audit --require-hashes -r requirements.txt
      - name: Audit installed CI tools and dependencies
        run: pip-audit --local
      - name: Check publication files
        run: python scripts/check_publication.py
      - name: Install pinned security tools
        env:
          GOBIN: ${{ runner.temp }}/security-tools
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
      - name: Scan complete history and current files
        env:
          TOOL_DIR: ${{ runner.temp }}/security-tools
        run: |
          "$TOOL_DIR/gitleaks" git --redact --log-opts="--all" .
          mkdir "$RUNNER_TEMP/publication-scan"
          git ls-files -z --cached --others --exclude-standard | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/publication-scan"
          "$TOOL_DIR/gitleaks" dir --redact "$RUNNER_TEMP/publication-scan"
      - name: Validate workflows
        env:
          TOOL_DIR: ${{ runner.temp }}/security-tools
        run: '"$TOOL_DIR/actionlint"'
